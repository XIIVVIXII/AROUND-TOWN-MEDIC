<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Cooldown System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f070f;
            --card-bg: #140814;
            --accent-color: #db2777;
            --accent-hover: #be185d;
            --text-color: #f1f5f9;
            --text-muted: #f472b680;
            --border-color: rgba(131, 24, 93, 0.4);
            --danger-color: #f43f5e;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #f472b6b3;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-btn:hover {
            color: var(--text-color);
            background: rgba(219,39,119,0.1);
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(219,39,119,0.5);
        }

        /* Pages */
        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards & Forms */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #f472b6;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #100510;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        /* Buttons */
        .btn-action {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-size: 15px;
            box-shadow: 0 0 10px rgba(219,39,119,0.4);
        }

        .btn-action:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.2);
            color: var(--danger-color);
            border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .btn-success-flash {
            background: var(--success-color) !important;
            color: #fff !important;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.4) !important;
        }

        /* Time Buttons Grid */
        .time-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }

        .time-btn {
            background: #100510;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .time-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            font-weight: 600;
            box-shadow: 0 0 10px rgba(219,39,119,0.5);
        }

        /* Preview Box */
        .preview-box {
            background: #100510;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 12px;
            color: #fbcfe8;
            font-size: 14px;
        }

        /* Search Dropdown */
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #140814;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-top: 4px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        .search-dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(131, 24, 93, 0.2);
            transition: background 0.2s;
            color: #f1f5f9;
        }

        .search-dropdown-item:hover {
            background: rgba(219,39,119,0.2);
            color: #f472b6;
        }

        /* History items */
        .history-item {
            background: #100510;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .history-time {
            font-size: 12px;
            color: #f472b6b3;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navigation Bar -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchPage(1)">🏥 ประกาศ Cooldown</button>
        <button class="nav-btn" onclick="switchPage(2)">📜 ประวัติประกาศ</button>
    </div>

    <!-- Page 1: Cooldown Generator -->
    <div id="page1" class="page active">
        <div class="card">
            <h2 style="margin-bottom: 20px; font-size: 20px; color: var(--accent-color); text-align: center;">🏥 สร้างประกาศ Cooldown โรงพยาบาล</h2>
            
            <div class="form-group">
                <label>ประเภท</label>
                <select id="targetType" onchange="onTypeChange()">
                    <option value="แก๊ง">แก๊ง</option>
                    <option value="ครอบครัว">ครอบครัว</option>
                    <option value="ประชาชน">ประชาชน</option>
                </select>
            </div>

            <div class="form-group">
                <label>ชื่อแก๊ง / ประชาชน:</label>
                <input type="text" id="targetNameInput" placeholder="คลิกเพื่อเลือก หรือพิมพ์ค้นหา/พิมพ์ชื่อเองได้เลย..." 
                       onfocus="showDropdown()" oninput="onSearchInput()" autocomplete="off">
                <div id="searchDropdown" class="search-dropdown"></div>
            </div>

            <div class="form-group">
                <label>เลือกระยะเวลา Cooldown:</label>
                <div id="timeButtonsContainer" class="time-buttons-grid"></div>
            </div>

            <div class="form-group" style="margin-top: 25px;">
                <label>🎮 ข้อความสำหรับในเกม</label>
                <div id="gamePreview" class="preview-box"></div>
                <button class="btn-action" onclick="copyAndLog('game', this)">📋 คัดลอกข้อความในเกม</button>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <label>💬 ข้อความสำหรับดิส </label>
                <div id="discordPreview" class="preview-box"></div>
                <button class="btn-action" onclick="copyAndLog('discord', this)">📋 คัดลอกข้อความ Discord</button>
            </div>
        </div>
    </div>

    <!-- Page 2: History -->
    <div id="page2" class="page">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 20px; color: var(--accent-color);">📜 ประวัติการประกาศ (ทุกคนเห็นร่วมกัน)</h2>
                <button class="btn-delete" onclick="clearHistory()" style="padding: 8px 14px;">🗑️ ลบประวัติทั้งหมด</button>
            </div>
            <div id="historyContainer"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDCoCTe-4c5EwySpeCF9Lzkx9WaDiBeGIE",
        authDomain: "around-town-armd-684f7.firebaseapp.com",
        databaseURL: "https://around-town-armd-684f7-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "around-town-armd-684f7",
        storageBucket: "around-town-armd-684f7.firebasestorage.app",
        messagingSenderId: "176321996941",
        appId: "1:176321996941:web:f697ff48100754a4bb9ac4",
        measurementId: "G-YV720SHKR0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let citizensData = [];
    const availableTimes = [3, 5];
    let selectedDuration = 3;
    let historyList = [];

    // ดึงข้อมูลรายชื่อประชาชนจาก Firebase
    function fetchCitizensFromFirebase() {
        const citizensRef = ref(db, 'aroundTown/citizens');
        onValue(citizensRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                citizensData = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
            } else {
                citizensData = [];
            }
        });
    }

    // ดึงประวัติประกาศจาก Firebase แบบ Real-time ของทุกคน
    function fetchHistoryFromFirebase() {
        const historyRef = ref(db, 'aroundTown/cooldown_history');
        onValue(historyRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // แปลงข้อมูล Object จาก Firebase ให้เป็น Array และเรียงจากใหม่ไปเก่า
                historyList = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).reverse();
            } else {
                historyList = [];
            }
            // ถ้านิสิต/แอดมินอยู่หน้าประวัติ ให้เรนเดอร์ใหม่ทันที
            const page2 = document.getElementById('page2');
            if (page2 && page2.classList.contains('active')) {
                renderHistoryList();
            }
        });
    }

    fetchCitizensFromFirebase();
    fetchHistoryFromFirebase();

    window.switchPage = function(pageNum) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(`page${pageNum}`).classList.add('active');
        document.querySelectorAll('.nav-btn')[pageNum - 1].classList.add('active');

        if(pageNum === 2) renderHistoryList();
    }

    window.onTypeChange = function() {
        document.getElementById('targetNameInput').value = '';
        generateText();
        showDropdown();
    }

    window.onSearchInput = function() {
        generateText();
        showDropdown();
    }

    window.showDropdown = function() {
        const selectedType = document.getElementById('targetType').value.trim();
        const keyword = document.getElementById('targetNameInput').value.toLowerCase().trim();
        const dropdown = document.getElementById('searchDropdown');
        
        const filteredNames = citizensData.filter(item => {
            if (!item || !item.name) return false;
            const itemType = String(item.type || '').trim();
            
            let matchType = false;
            if (selectedType === 'แก๊ง') {
                matchType = (itemType === 'แก๊ง' || itemType === 'แก๊งค์');
            } else {
                matchType = (itemType === selectedType);
            }

            const matchKeyword = item.name.toLowerCase().includes(keyword);
            return matchType && matchKeyword;
        });

        if (filteredNames.length === 0) {
            dropdown.innerHTML = '<div class="search-dropdown-item" style="color: #f472b6b3; cursor: default;">ไม่พบข้อมูลในระบบ (สามารถพิมพ์ชื่อเองได้เลย)</div>';
            dropdown.style.display = 'block';
            return;
        }

        dropdown.innerHTML = '';
        filteredNames.forEach(item => {
            let div = document.createElement('div');
            div.className = 'search-dropdown-item';
            div.innerText = item.name;
            div.onmousedown = () => {
                document.getElementById('targetNameInput').value = item.name;
                generateText();
                hideDropdown();
            };
            dropdown.appendChild(div);
        });

        dropdown.style.display = 'block';
    }

    function hideDropdown() {
        setTimeout(() => {
            const dropdown = document.getElementById('searchDropdown');
            if (dropdown) dropdown.style.display = 'none';
        }, 200);
    }

    window.addEventListener('click', function(e) {
        const inputElem = document.getElementById('targetNameInput');
        const dropdownElem = document.getElementById('searchDropdown');
        if (inputElem && dropdownElem && !inputElem.contains(e.target) && !dropdownElem.contains(e.target)) {
            hideDropdown();
        }
    });

    function renderTimeButtons() {
        const container = document.getElementById('timeButtonsContainer');
        if (!container) return;
        container.innerHTML = '';
        
        availableTimes.forEach((time) => {
            let btn = document.createElement('button');
            btn.className = `time-btn ${time === selectedDuration ? 'active' : ''}`;
            btn.innerText = `${time} นาที`;
            btn.onclick = () => {
                selectedDuration = time;
                renderTimeButtons();
                generateText();
            };
            container.appendChild(btn);
        });
    }

    window.generateText = function() {
        const typeElem = document.getElementById('targetType');
        const nameElem = document.getElementById('targetNameInput');
        
        if (!typeElem || !nameElem) return;

        const type = typeElem.value;
        const nameInputVal = nameElem.value.trim();
        
        const now = new Date();
        const startTimeStr = formatTime(now);
        
        const duration = Number(selectedDuration) || 0;
        const endTime = new Date(now.getTime() + duration * 60000);
        const endTimeStr = formatTime(endTime);
        
        let displayTarget = nameInputVal !== '' ? `${nameInputVal}` : '.....';
        let prefix = "";

        if (type === 'แก๊ง') {
            prefix = `แก๊ง : ${displayTarget}`;
        } else if (type === 'ครอบครัว') {
            prefix = `family : ${displayTarget}`;
        } else if (type === 'ประชาชน') {
            prefix = `ประชาชน : ${displayTarget}`;
        } else {
            prefix = `${type} : ${displayTarget}`;
        }

        const cleanStart = startTimeStr.replace(/\s*:\s*/g, ':');
        const cleanEnd = endTimeStr.replace(/\s*:\s*/g, ':');

        const gameText = `ประกาศออกจากพื้นที่โรงพยาบาล ${prefix} ออกจากพื้นที่โรงพยาบาลภายใน ระยะเวลา ${duration} นาที เริ่มตั้งแต่เวลา ${cleanStart} ถึง ${cleanEnd} ขอบคุณครับ/ค่ะ`;
        const discordText = `# ประกาศออกจากพื้นที่โรงพยาบาล \n\`\`\`\nประกาศออกจากพื้นที่โรงพยาบาล  ${prefix} ออกจากพื้นที่โรงพยาบาลภายใน ระยะเวลา ${duration} นาที เริ่มตั้งแต่เวลา ${cleanStart} ถึง ${cleanEnd} ขอบคุณครับ/ค่ะ\n\`\`\`\n<@&1473606329536090258>`;
        
        const gamePreview = document.getElementById('gamePreview');
        const discordPreview = document.getElementById('discordPreview');

        if (gamePreview) gamePreview.innerText = gameText;
        if (discordPreview) discordPreview.innerText = discordText;
    }

    function formatTime(date) {
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${hours} : ${minutes} น.`;
    }

    window.copyAndLog = function(type, btn) {
        const textToCopy = type === 'game' 
            ? document.getElementById('gamePreview').innerText 
            : document.getElementById('discordPreview').innerText;

        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btn.innerText;
            btn.classList.add('btn-success-flash');
            btn.innerText = '✓ คัดลอกสำเร็จ!';
            
            setTimeout(() => {
                btn.classList.remove('btn-success-flash');
                btn.innerText = originalText;
            }, 1000);
            
            // บันทึกประวัติลง Firebase เพื่อให้ทุกคนเห็นร่วมกัน
            const historyRef = ref(db, 'aroundTown/cooldown_history');
            const newHistoryItem = {
                text: textToCopy,
                time: new Date().toLocaleString('th-TH')
            };
            push(historyRef, newHistoryItem);
        });
    }

    function renderHistoryList() {
        const container = document.getElementById('historyContainer');
        if (!container) return;
        container.innerHTML = '';

        if(historyList.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 30px; font-size: 16px;">ยังไม่มีประวัติการประกาศจ้า</div>';
            return;
        }

        historyList.forEach((item) => {
            let div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div style="flex: 1;">
                    <div class="history-time">🕒 ${item.time}</div>
                    <div style="word-break: break-all; white-space: pre-wrap; color: #f1f5f9;">${item.text}</div>
                </div>
                <button class="btn-delete" onclick="deleteHistoryItem('${item.id}')">ลบ</button>
            `;
            container.appendChild(div);
        });
    }

    window.deleteHistoryItem = function(id) {
        const itemRef = ref(db, `aroundTown/cooldown_history/${id}`);
        remove(itemRef);
    }

    window.clearHistory = function() {
        if(confirm("คุณต้องการลบประวัติการประกาศทั้งหมดของทุกคนใช่หรือไม่?")) {
            const historyRef = ref(db, 'aroundTown/cooldown_history');
            set(historyRef, null);
        }
    }

    function initApp() {
        renderTimeButtons();
        generateText();
    }

    initApp();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคัดลอกข้อความประกาศเคส</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121214;
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #dcddde;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 820px;
            padding: 30px;
            box-sizing: border-box;
        }

        /* หัวข้อใหญ่ด้านบน พร้อมปุ่มสลับหน้า */
        .page-header {
            background-color: #18181b;
            border: 1px solid #27272a;
            padding: 18px 24px;
            border-radius: 14px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #f43f5e;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: #09090b;
            border: 1px solid #27272a;
            color: #a1a1aa;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #f43f5e;
            color: #fff;
            border-color: #f43f5e;
        }

        /* ตั้งค่าบังคับซ่อน/แสดงหน้าจออย่างเด็ดขาด */
        .tab-content {
            display: none !important;
            flex-direction: column;
            gap: 20px;
        }

        .tab-content.active {
            display: flex !important;
        }

        .form-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #f4f4f5;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #f43f5e;
        }

        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: #f4f4f5;
            margin: 8px 0 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .preview-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            color: #a1a1aa;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            min-height: 52px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            color: #ffffff;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #e11d48, #be123c);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-action.success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3) !important;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .history-item {
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-time {
            font-size: 11px;
            color: #f43f5e;
            font-weight: 500;
        }

        .btn-delete-single {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-size: 11px;
            transition: all 0.2s;
        }

        .btn-delete-single:hover {
            background: #ef4444;
            color: #fff;
        }

        .history-text {
            color: #e4e4e7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-history {
            text-align: center;
            color: #71717a;
            padding: 40px;
            font-size: 14px;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #f43f5e;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 12px;
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.2s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- หัวข้อใหญ่ด้านบน พร้อมปุ่มสลับหน้า -->
        <div class="page-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span>🚨</span>
                <span>ประกาศไม่พบศพ</span>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('form', this)">ฟอร์มประกาศ</button>
                <button class="tab-btn" onclick="switchTab('history', this)">ประวัติ <span id="historyCount" style="background:#f43f5e; color:#fff; padding:1px 5px; border-radius:4px; font-size:10px;">0</span></button>
            </div>
        </div>

        <!-- หน้าที่ 1: ฟอร์มประกาศ -->
        <div id="tabForm" class="tab-content active form-card">
            <div class="form-row">
                <div class="form-group" style="flex: 1.2;">
                    <label for="charName">ชื่อผู้สลบ :</label>
                    <input type="text" id="charName" placeholder="พิมพ์ชื่อ...">
                </div>
                <div class="form-group" style="flex: 0.8;">
                    <label for="charPhone">เบอร์โทร :</label>
                    <input type="text" id="charPhone" placeholder="เบอร์...">
                </div>
            </div>

            <div class="form-group">
                <label for="caseType">เลือกประเภทเคส</label>
                <select id="caseType">
                    <option value="notFound">ไม่พบศพ</option>
                    <option value="lostMap">เคสตกแมพ</option>
                </select>
            </div>

            <div>
                <div class="section-title">📝 ข้อความสำหรับในเกม</div>
                <div id="previewGame" class="preview-box"></div>
                <div style="margin-top: 10px;">
                    <button id="btnGame" class="btn-action" onclick="copyGameText()">📋 คัดลอกข้อความในเกม</button>
                </div>
            </div>

            <div>
                <div class="section-title">💬 ข้อความสำหรับ Discord</div>
                <div id="previewDiscord" class="preview-box"></div>
                <div style="margin-top: 10px;">
                    <button id="btnDiscord" class="btn-action" onclick="copyDiscordText()">📋 คัดลอกข้อความ Discord</button>
                </div>
            </div>
        </div>

        <!-- หน้าที่ 2: ประวัติการประกาศ (แยกหน้าต่างหาก 100%) -->
        <div id="tabHistory" class="tab-content form-card">
            <div class="section-title">
                <span>📜 ประวัติการประกาศทั้งหมด (ซิงค์ Real-time ข้ามเครื่อง)</span>
                <button onclick="clearAllHistory()" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-family: 'Prompt'; font-size: 11px;">ล้างประวัติทั้งหมด</button>
            </div>
            <div id="historyList" class="history-list">
                <div class="empty-history">ยังไม่มีประวัติการประกาศ</div>
            </div>
        </div>

    </div>

    <div id="toast">คัดลอกข้อความสำเร็จ!</div>

    <!-- Firebase SDK และระบบจัดการข้อมูล -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCoCTe-4c5EwySpeCF9Lzkx9WaDiBeGIE",
            authDomain: "around-town-armd-684f7.firebaseapp.com",
            databaseURL: "https://around-town-armd-684f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "around-town-armd-684f7",
            storageBucket: "around-town-armd-684f7.firebasestorage.app",
            messagingSenderId: "176321996941",
            appId: "1:176321996941:web:f697ff48100754a4bb9ac4",
            measurementId: "G-YV720SHKR0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const nameInput = document.getElementById('charName');
        const phoneInput = document.getElementById('charPhone');
        const caseTypeSelect = document.getElementById('caseType');
        
        const previewGame = document.getElementById('previewGame');
        const previewDiscord = document.getElementById('previewDiscord');

        const btnGame = document.getElementById('btnGame');
        const btnDiscord = document.getElementById('btnDiscord');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');

        let historyMap = {};

        // ดึงข้อมูลประวัติจาก Firebase แบบ Real-time
        onValue(ref(db, 'caseAnnouncement/history'), (snapshot) => {
            const data = snapshot.val() || {};
            historyMap = data; 

            updateHistoryCount();
            renderHistory();
        });

        function getName() {
            return nameInput.value.trim() || '.....';
        }

        function getPhone() {
            return phoneInput.value.trim() || '.....';
        }

        function updatePreviews() {
            const caseType = caseTypeSelect.value;
            const name = getName();
            const phone = getPhone();

            if (caseType === 'notFound') {
                previewGame.textContent = `แพทย์ไม่พบผู้สลบ ชื่อ : ${name}  เบอร์ : ${phone}  กรุณาลงห้องติดต่อแพทย์/หรือแจ้งเคสตกหล่น ในนิตยสารประเทศค่ะ/ครับ`;
                previewDiscord.textContent = "```\nแพทย์ไม่พบผู้สลบชื่อ " + name + " เบอร์ " + phone + " กรุณาลงห้องติดต่อแพทย์/หรือแจ้งเคสตกหล่น ในนิตยสารประเทศค่ะ/ครับ\n```\n<@&1473606329536090258>";
            } else {
                previewGame.textContent = `ผู้สลบชื่อ : ${name}   เบอร์ : ${phone}  เนื่องจากผู้สลบอยู่นอกเหนือการช่วยเหลือของแพทย์ กรุณาแจ้ง Report แอดมิน หรือ ห้องตกแมพ-บัค-ลงเมืองไม่ได้ ในนิตยสารประเทศค่ะ/ครับ`;
                previewDiscord.textContent = "```\nผู้สลบชื่อ " + name + " เบอร์ " + phone + " เนื่องจากผู้สลบอยู่นอกเหนือการช่วยเหลือของแพทย์ กรุณาแจ้ง Report แอดมิน หรือ ห้องตกแมพ-บัค-ลงเมืองไม่ได้ ในนิตยสารประเทศค่ะ/ครับ\n```\n<@&1473606329536090258>";
            }
        }

        nameInput.addEventListener('input', updatePreviews);
        phoneInput.addEventListener('input', updatePreviews);
        caseTypeSelect.addEventListener('change', updatePreviews);

        updatePreviews();

        window.switchTab = function(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'form') {
                document.getElementById('tabForm').classList.add('active');
            } else {
                document.getElementById('tabHistory').classList.add('active');
                renderHistory();
            }
            el.classList.add('active');
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2200);
        }

        function triggerButtonAnimation(button, originalText) {
            button.classList.add('success');
            button.innerHTML = '✅ คัดลอกสำเร็จ!';
            setTimeout(() => {
                button.classList.remove('success');
                button.innerHTML = originalText;
            }, 1500);
        }

        function addHistoryToFirebase(text) {
            const now = new Date();
            const timeString = now.toLocaleDateString('th-TH', { 
                year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            const historyRef = ref(db, 'caseAnnouncement/history');
            push(historyRef, { time: timeString, text: text });
        }

        window.copyGameText = function() {
            const textToCopy = previewGame.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("คัดลอกข้อความในเกมสำเร็จ!");
                triggerButtonAnimation(btnGame, '📋 คัดลอกข้อความในเกม');
                addHistoryToFirebase(textToCopy);
            });
        }

        window.copyDiscordText = function() {
            const textToCopy = previewDiscord.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("คัดลอกข้อความ Discord สำเร็จ!");
                triggerButtonAnimation(btnDiscord, '📋 คัดลอกข้อความ Discord');
                addHistoryToFirebase(textToCopy);
            });
        }

        function renderHistory() {
            const keys = Object.keys(historyMap);
            if (keys.length === 0) {
                historyList.innerHTML = '<div class="empty-history">ยังไม่มีประวัติการประกาศ</div>';
                updateHistoryCount();
                return;
            }

            const items = keys.map(key => ({ id: key, ...historyMap[key] })).reverse();

            historyList.innerHTML = '';
            items.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-header-row">
                        <div class="history-time">🕒 คัดลอกเมื่อ: ${item.time}</div>
                        <button class="btn-delete-single" onclick="deleteSingleHistory('${item.id}')">ลบ</button>
                    </div>
                    <div class="history-text">${item.text}</div>
                `;
                historyList.appendChild(div);
            });
            updateHistoryCount();
        }

        function updateHistoryCount() {
            if (historyCount) {
                historyCount.textContent = Object.keys(historyMap).length;
            }
        }

        window.deleteSingleHistory = function(id) {
            if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                const singleRef = ref(db, `caseAnnouncement/history/${id}`);
                remove(singleRef).then(() => {
                    showToast("ลบรายการสำเร็จ");
                });
            }
        }

        window.clearAllHistory = function() {
            if (confirm('คุณต้องการล้างประวัติทั้งหมดใช่หรือไม่? (จะมีผลกับทุกเครื่องที่เปิดอยู่)')) {
                const historyRef = ref(db, 'caseAnnouncement/history');
                remove(historyRef).then(() => {
                    showToast("ล้างประวัติทั้งหมดสำเร็จ");
                });
            }
        }

        updateHistoryCount();
    </script>

</body>
</html>

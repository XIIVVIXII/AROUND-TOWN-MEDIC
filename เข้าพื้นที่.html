<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประกาศเข้าพื้นที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top center, #1e1b29 0%, #0d0d11 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #dcddde;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 820px;
            padding: 30px;
            box-sizing: border-box;
        }

        .page-header {
            background: linear-gradient(145deg, #18181b, #121215);
            border: 1px solid rgba(244, 63, 94, 0.2);
            padding: 18px 24px;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #f43f5e;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-card {
            background: linear-gradient(145deg, #18181b, #111114);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 16px 32px -8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            flex: 1;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #f4f4f5;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .form-group input:focus {
            border-color: #f43f5e;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(244, 63, 94, 0.2);
        }

        .dropdown-list {
            position: absolute;
            top: calc(100% - 4px);
            left: 0;
            right: 0;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }

        .dropdown-item {
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: #27272a;
            color: #f43f5e;
        }

        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: #f4f4f5;
            margin: 8px 0 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 18px;
            border-radius: 12px;
            font-size: 14px;
            color: #a1a1aa;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            min-height: 60px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ffffff;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 15px rgba(244, 63, 94, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #fb7185, #f43f5e);
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .btn-action.success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.2) !important;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #f43f5e;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.2s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 30px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="page-header">
            <span>🚜</span>
            <span>ประกาศเข้าพื้นที่</span>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label for="locationInput">ค้นหาหรือพิมพ์ระบุบริเวณสถานที่ :</label>
                <input type="text" id="locationInput" placeholder="พิมพ์ค้นหาชื่อสถานที่..." autocomplete="off" oninput="onLocationInput()" onfocus="showDropdown()">
                <div id="dropdownList" class="dropdown-list"></div>
            </div>

            <div>
                <div class="section-title">📝 ข้อความสำหรับประกาศเข้าพื้นที่:</div>
                <div id="previewBox" class="preview-box"></div>
                <div style="margin-top: 14px;">
                    <button id="btnCopy" class="btn-action" onclick="copyText()">📋 คัดลอกข้อความ</button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast">คัดลอกข้อความสำเร็จ!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCoCTe-4c5EwySpeCF9Lzkx9WaDiBeGIE",
            authDomain: "around-town-armd-684f7.firebaseapp.com",
            databaseURL: "https://around-town-armd-684f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "around-town-armd-684f7",
            storageBucket: "around-town-armd-684f7.firebasestorage.app",
            messagingSenderId: "176321996941",
            appId: "1:176321996941:web:f697ff48100754a4bb9ac4",
            measurementId: "G-YV720SHKR0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const locationInput = document.getElementById('locationInput');
        const dropdownList = document.getElementById('dropdownList');
        const previewBox = document.getElementById('previewBox');
        const btnCopy = document.getElementById('btnCopy');

        let locationsData = [];

        // เชื่อมต่อและดึงข้อมูลจาก Firebase แบบ Real-time โหนด aroundTown
        onValue(ref(db, 'aroundTown'), (snapshot) => {
            const data = snapshot.val() || {};
            locationsData = data.locations || [];
            locationsData.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
        }, (error) => {
            console.error("Firebase connection error: ", error);
        });

        window.showDropdown = function() {
            renderDropdownItems();
            dropdownList.style.display = 'block';
        }

        window.onLocationInput = function() {
            renderDropdownItems();
            dropdownList.style.display = 'block';
            updatePreview();
        }

        function renderDropdownItems() {
            const keyword = locationInput.value.toLowerCase().trim();
            const filtered = locationsData.filter(loc => {
                if (!loc || !loc.name) return false;
                return loc.name.toLowerCase().includes(keyword);
            });

            dropdownList.innerHTML = '';

            if (filtered.length === 0) {
                dropdownList.innerHTML = '<div class="dropdown-item" style="color: #71717a; cursor: default;">ไม่พบสถานที่ในระบบ</div>';
                return;
            }

            filtered.forEach(loc => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.textContent = loc.name;
                item.onclick = function() {
                    locationInput.value = loc.name;
                    dropdownList.style.display = 'none';
                    updatePreview();
                };
                dropdownList.appendChild(item);
            });
        }

        // ซ่อน Dropdown เมื่อคลิกนอกพื้นที่ช่องค้นหา
        document.addEventListener('click', function(e) {
            if (!locationInput.contains(e.target) && !dropdownList.contains(e.target)) {
                dropdownList.style.display = 'none';
            }
        });

        function getLocation() {
            return locationInput.value.trim() || '.....';
        }

        function getTargetTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 2); // บวกเพิ่ม 2 นาที
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours} : ${minutes}`;
        }

        function updatePreview() {
            const loc = getLocation();
            const timeStr = getTargetTime();
            previewBox.textContent = `ขณะนี้หมอกำลังจะทำการเข้าพื้นที่สตอรี่ บริเวณ ${loc} ขอให้ผู้ที่อยู่ในพื้นที่ ที่มีสตอรี่ออกจากพื้นที่ก่อนเวลา ${timeStr} น. ขอบคุณค่ะ/ครับ`;
        }

        // อัปเดตเวลาถอยหลังแบบเรียลไทม์ทุกๆ 1 วินาที
        updatePreview();
        setInterval(updatePreview, 1000);

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2200);
        }

        window.copyText = function() {
            navigator.clipboard.writeText(previewBox.textContent).then(() => {
                showToast("คัดลอกข้อความสำเร็จ!");
                btnCopy.classList.add('success');
                btnCopy.innerHTML = '✅ คัดลอกสำเร็จ!';
                setTimeout(() => {
                    btnCopy.classList.remove('success');
                    btnCopy.innerHTML = '📋 คัดลอกข้อความ';
                }, 1500);
            });
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประกาศเข้าพื้นที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top center, #1e1b29 0%, #0d0d11 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #dcddde;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            padding: 30px;
            box-sizing: border-box;
        }

        /* นาฬิกาตัวใหญ่เด่นชัดแบบไม่มีข้อความกำกับ */
        .big-clock-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        .big-clock-time {
            font-family: 'Courier New', Courier, monospace;
            font-size: 64px;
            font-weight: 700;
            color: #f43f5e;
            text-shadow: 0 0 25px rgba(244, 63, 94, 0.5);
            letter-spacing: 3px;
            line-height: 1;
        }

        /* กรอบหลักรวมส่วนหัวและฟอร์มเข้าด้วยกัน */
        .main-card {
            background: linear-gradient(145deg, #18181b, #111114);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 35px 40px;
            border-radius: 18px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid #27272a;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            color: #f43f5e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: #09090b;
            border: 1px solid #27272a;
            color: #a1a1aa;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #f43f5e;
            color: #fff;
            border-color: #f43f5e;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 25px;
        }

        .tab-content.active {
            display: flex;
        }

        .form-group {
            flex: 1;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #f4f4f5;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #f43f5e;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 12px rgba(244, 63, 94, 0.25);
        }

        .dropdown-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 14px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7);
        }

        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: #27272a;
            color: #f43f5e;
        }

        .section-title {
            font-size: 15px;
            font-weight: 500;
            color: #f4f4f5;
            margin: 10px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 22px;
            border-radius: 14px;
            font-size: 15px;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.7;
            min-height: 80px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ffffff;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #fb7185, #f43f5e);
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .btn-action.success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.2) !important;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-time {
            font-size: 12px;
            color: #f43f5e;
            font-weight: 500;
        }

        .history-text {
            color: #e4e4e7;
        }

        .empty-history {
            text-align: center;
            color: #71717a;
            padding: 30px;
        }

        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #f43f5e;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 14px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.2s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 40px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 40px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- นาฬิกาดิจิทัลตัวใหญ่แบบไม่มีข้อความกำกับ -->
        <div class="big-clock-container">
            <div id="clockTime" class="big-clock-time">00:00:00</div>
        </div>

        <!-- กรอบหลักรวมส่วนหัวและฟอร์มเข้าด้วยกัน -->
        <div class="main-card">
            <div class="page-header">
                <div class="header-title">
                    <span>🚜</span>
                    <span>ระบบประกาศเข้าพื้นที่</span>
                </div>

                <div class="nav-tabs">
                    <button class="tab-btn active" onclick="switchTab('form', this)">ประกาศ</button>
                    <button class="tab-btn" onclick="switchTab('history', this)">ประวัติการประกาศ <span id="historyCount" style="background:#f43f5e; color:#fff; padding:2px 6px; border-radius:6px; font-size:11px;">0</span></button>
                </div>
            </div>

            <!-- แท็บฟอร์มประกาศ -->
            <div id="tabForm" class="tab-content active">
                <div class="form-group">
                    <label for="numberInput">หมายเลขสถานที่</label>
                    <input type="text" id="numberInput" placeholder="พิมพ์ตัวเลข เช่น 1, 2..." autocomplete="off" oninput="onNumberInput()" onfocus="showDropdown()">
                    <div id="dropdownList" class="dropdown-list"></div>
                </div>

                <div class="form-group">
                    <label for="locationNameInput">ชื่อสถานที่</label>
                    <input type="text" id="locationNameInput" placeholder="ชื่อสถานที่..." autocomplete="off" oninput="updatePreview()">
                </div>

                <div>
                    <div class="section-title">📝 ข้อความสำหรับประกาศเข้าพื้นที่:</div>
                    <div id="previewBox" class="preview-box"></div>
                    <div style="margin-top: 18px;">
                        <button id="btnCopy" class="btn-action" onclick="copyText()">📋 คัดลอกข้อความ</button>
                    </div>
                </div>
            </div>

            <!-- แท็บประวัติ -->
            <div id="tabHistory" class="tab-content">
                <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>📜 ประวัติการคัดลอกประกาศล่าสุด</span>
                    <button onclick="clearHistory()" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-family: 'Prompt'; font-size: 12px;">ล้างประวัติ</button>
                </div>
                <div id="historyList" class="history-list">
                    <div class="empty-history">ยังไม่มีประวัติการประกาศ</div>
                </div>
            </div>
        </div>

    </div>

    <div id="toast">คัดลอกข้อความสำเร็จ!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCoCTe-4c5EwySpeCF9Lzkx9WaDiBeGIE",
            authDomain: "around-town-armd-684f7.firebaseapp.com",
            databaseURL: "https://around-town-armd-684f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "around-town-armd-684f7",
            storageBucket: "around-town-armd-684f7.firebasestorage.app",
            messagingSenderId: "176321996941",
            appId: "1:176321996941:web:f697ff48100754a4bb9ac4",
            measurementId: "G-YV720SHKR0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const numberInput = document.getElementById('numberInput');
        const locationNameInput = document.getElementById('locationNameInput');
        const dropdownList = document.getElementById('dropdownList');
        const previewBox = document.getElementById('previewBox');
        const btnCopy = document.getElementById('btnCopy');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');
        const clockTime = document.getElementById('clockTime');

        let locationsData = [];
        let historyData = JSON.parse(localStorage.getItem('announcement_history') || '[]');

        onValue(ref(db, 'aroundTown'), (snapshot) => {
            const data = snapshot.val() || {};
            locationsData = data.locations || [];
            locationsData.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
        }, (error) => {
            console.error("Firebase connection error: ", error);
        });

        function parseLocationItem(fullName) {
            if (!fullName) return { num: '', name: '' };
            const match = fullName.trim().match(/^(\d+)[\s\.\-]*(.*)$/);
            if (match) {
                return { num: match[1], name: match[2].trim() };
            }
            return { num: '', name: fullName.trim() };
        }

        window.showDropdown = function() {
            renderDropdownItems();
            dropdownList.style.display = 'block';
        }

        window.onNumberInput = function() {
            renderDropdownItems();
            dropdownList.style.display = 'block';
            
            const keyword = numberInput.value.trim();
            const found = locationsData.find(loc => {
                const parsed = parseLocationItem(loc.name);
                return parsed.num === keyword;
            });

            if (keyword === "") {
                locationNameInput.value = '';
            } else if (found) {
                const parsed = parseLocationItem(found.name);
                locationNameInput.value = parsed.name;
            }
            updatePreview();
        }

        function renderDropdownItems() {
            const keyword = numberInput.value.toLowerCase().trim();
            const filtered = locationsData.filter(loc => {
                if (!loc || !loc.name) return false;
                const parsed = parseLocationItem(loc.name);
                return parsed.num.toLowerCase().includes(keyword) || loc.name.toLowerCase().includes(keyword);
            });

            dropdownList.innerHTML = '';

            if (filtered.length === 0) {
                dropdownList.innerHTML = '<div class="dropdown-item" style="color: #71717a; cursor: default;">ไม่พบหมายเลขในระบบ</div>';
                return;
            }

            filtered.forEach(loc => {
                const parsed = parseLocationItem(loc.name);
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.textContent = `${parsed.num} : ${parsed.name}`;
                item.onclick = function() {
                    numberInput.value = parsed.num;
                    locationNameInput.value = parsed.name;
                    dropdownList.style.display = 'none';
                    updatePreview();
                };
                dropdownList.appendChild(item);
            });
        }

        document.addEventListener('click', function(e) {
            if (!numberInput.contains(e.target) && !dropdownList.contains(e.target)) {
                dropdownList.style.display = 'none';
            }
        });

        function getTargetTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 2);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            if (clockTime) {
                clockTime.textContent = `${h}:${m}:${s}`;
            }

            updatePreview();
        }

        window.updatePreview = function() {
            const loc = locationNameInput.value.trim() || '.....';
            const timeStr = getTargetTime();
            previewBox.textContent = `ขณะนี้หมอกำลังจะทำการเข้าพื้นที่สตอรี่ บริเวณ ${loc} ขอให้ผู้ที่อยู่ในพื้นที่ ที่มีสตอรี่ออกจากพื้นที่ก่อนเวลา ${timeStr} น. ขอบคุณค่ะ/ครับ`;
        }

        setInterval(tick, 1000);
        tick();

        window.switchTab = function(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tabName === 'form') {
                document.getElementById('tabForm').classList.add('active');
            } else {
                document.getElementById('tabHistory').classList.add('active');
                renderHistory();
            }
            el.classList.add('active');
        }

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2200);
        }

        window.copyText = function() {
            const textToCopy = previewBox.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("คัดลอกข้อความสำเร็จ!");
                btnCopy.classList.add('success');
                btnCopy.innerHTML = '✅ คัดลอกสำเร็จ!';

                addHistory(textToCopy);

                setTimeout(() => {
                    btnCopy.classList.remove('success');
                    btnCopy.innerHTML = '📋 คัดลอกข้อความ';
                }, 1500);
            });
        }

        function addHistory(text) {
            const now = new Date();
            const timeString = now.toLocaleDateString('th-TH', { 
                year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            historyData.unshift({ time: timeString, text: text });
            if (historyData.length > 50) historyData.pop();
            localStorage.setItem('announcement_history', JSON.stringify(historyData));
            updateHistoryCount();
        }

        function renderHistory() {
            if (historyData.length === 0) {
                historyList.innerHTML = '<div class="empty-history">ยังไม่มีประวัติการประกาศ</div>';
                updateHistoryCount();
                return;
            }

            historyList.innerHTML = '';
            historyData.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-time">🕒 คัดลอกเมื่อ: ${item.time}</div>
                    <div class="history-text">${item.text}</div>
                `;
                historyList.appendChild(div);
            });
            updateHistoryCount();
        }

        function updateHistoryCount() {
            historyCount.textContent = historyData.length;
        }

        window.clearHistory = function() {
            historyData = [];
            localStorage.removeItem('announcement_history');
            renderHistory();
            showToast("ล้างประวัติสำเร็จ");
        }

        updateHistoryCount();
    </script>

</body>
</html>

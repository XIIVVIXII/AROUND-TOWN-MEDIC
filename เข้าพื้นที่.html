<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประกาศเข้าพื้นที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top center, #1e1b29 0%, #0d0d11 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #dcddde;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            padding: 40px;
            box-sizing: border-box;
        }

        .page-header {
            background: linear-gradient(145deg, #18181b, #121215);
            border: 1px solid rgba(244, 63, 94, 0.2);
            padding: 22px 30px;
            border-radius: 18px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #f43f5e;
            box-shadow: 0 12px 30px -5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .form-card {
            background: linear-gradient(145deg, #18181b, #111114);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .form-group {
            flex: 1;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #f4f4f5;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #f43f5e;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 12px rgba(244, 63, 94, 0.25);
        }

        .form-group input[readonly] {
            background-color: #121216;
            color: #10b981;
            font-weight: 600;
            cursor: not-allowed;
        }

        .dropdown-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #09090b;
            border: 1px solid #27272a;
            border-radius: 14px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7);
        }

        .dropdown-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: #27272a;
            color: #f43f5e;
        }

        .section-title {
            font-size: 15px;
            font-weight: 500;
            color: #f4f4f5;
            margin: 10px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-box {
            background-color: #09090b;
            border: 1px solid #27272a;
            padding: 22px;
            border-radius: 14px;
            font-size: 15px;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.7;
            min-height: 80px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #ffffff;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #fb7185, #f43f5e);
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .btn-action.success {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4), inset 0 1px 0 rgba(255,255,255,0.2) !important;
        }

        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #f43f5e;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 14px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.2s;
        }

        @keyframes fadein {
            from { bottom: 0; opacity: 0; }
            to { bottom: 40px; opacity: 1; }
        }

        @keyframes fadeout {
            from { bottom: 40px; opacity: 1; }
            to { bottom: 0; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="page-header">
            <span>🚜</span>
            <span>ระบบประกาศเข้าพื้นที่</span>
        </div>

        <div class="form-card">
            <!-- ช่องที่ 1: ค้นหารหัส / หมายเลขสถานที่ -->
            <div class="form-group">
                <label for="numberInput">หมายเลขสถานที่ </label>
                <input type="text" id="numberInput" placeholder="พิมพ์ตัวเลข เช่น 1, 2..." autocomplete="off" oninput="onNumberInput()" onfocus="showDropdown()">
                <div id="dropdownList" class="dropdown-list"></div>
            </div>

            <!-- ช่องที่ 2: ชื่อสถานที่ (แสดงอัตโนมัติ) -->
            <div class="form-group">
                <label for="locationNameInput"> ชื่อสถานที่ </label>
                <input type="text" id="locationNameInput" placeholder="ชื่อสถานที่..." readonly>
            </div>

            <div>
                <div class="section-title">📝 ข้อความสำหรับประกาศเข้าพื้นที่:</div>
                <div id="previewBox" class="preview-box"></div>
                <div style="margin-top: 18px;">
                    <button id="btnCopy" class="btn-action" onclick="copyText()">📋 คัดลอกข้อความ</button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast">คัดลอกข้อความสำเร็จ!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCoCTe-4c5EwySpeCF9Lzkx9WaDiBeGIE",
            authDomain: "around-town-armd-684f7.firebaseapp.com",
            databaseURL: "https://around-town-armd-684f7-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "around-town-armd-684f7",
            storageBucket: "around-town-armd-684f7.firebasestorage.app",
            messagingSenderId: "176321996941",
            appId: "1:176321996941:web:f697ff48100754a4bb9ac4",
            measurementId: "G-YV720SHKR0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const numberInput = document.getElementById('numberInput');
        const locationNameInput = document.getElementById('locationNameInput');
        const dropdownList = document.getElementById('dropdownList');
        const previewBox = document.getElementById('previewBox');
        const btnCopy = document.getElementById('btnCopy');

        let locationsData = [];

        onValue(ref(db, 'aroundTown'), (snapshot) => {
            const data = snapshot.val() || {};
            locationsData = data.locations || [];
            locationsData.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));
        }, (error) => {
            console.error("Firebase connection error: ", error);
        });

        function parseLocationItem(fullName) {
            if (!fullName) return { num: '', name: '' };
            const match = fullName.trim().match(/^(\d+)[\s\.\-]*(.*)$/);
            if (match) {
                return { num: match[1], name: match[2].trim() };
            }
            return { num: '', name: fullName.trim() };
        }

        window.showDropdown = function() {
            renderDropdownItems();
            dropdownList.style.display = 'block';
        }

        window.onNumberInput = function() {
            renderDropdownItems();
            dropdownList.style.display = 'block';
            
            const keyword = numberInput.value.trim();
            const found = locationsData.find(loc => {
                const parsed = parseLocationItem(loc.name);
                return parsed.num === keyword;
            });

            if (found) {
                const parsed = parseLocationItem(found.name);
                locationNameInput.value = parsed.name;
            } else {
                locationNameInput.value = '';
            }
            updatePreview();
        }

        function renderDropdownItems() {
            const keyword = numberInput.value.toLowerCase().trim();
            const filtered = locationsData.filter(loc => {
                if (!loc || !loc.name) return false;
                const parsed = parseLocationItem(loc.name);
                return parsed.num.toLowerCase().includes(keyword) || loc.name.toLowerCase().includes(keyword);
            });

            dropdownList.innerHTML = '';

            if (filtered.length === 0) {
                dropdownList.innerHTML = '<div class="dropdown-item" style="color: #71717a; cursor: default;">ไม่พบหมายเลขในระบบ</div>';
                return;
            }

            filtered.forEach(loc => {
                const parsed = parseLocationItem(loc.name);
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.textContent = `${parsed.num} : ${parsed.name}`;
                item.onclick = function() {
                    numberInput.value = parsed.num;
                    locationNameInput.value = parsed.name;
                    dropdownList.style.display = 'none';
                    updatePreview();
                };
                dropdownList.appendChild(item);
            });
        }

        document.addEventListener('click', function(e) {
            if (!numberInput.contains(e.target) && !dropdownList.contains(e.target)) {
                dropdownList.style.display = 'none';
            }
        });

        function getTargetTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() + 2);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`; // ปรับให้ชิดกันไม่มีช่องว่าง
        }

        function updatePreview() {
            const loc = locationNameInput.value.trim() || '.....';
            const timeStr = getTargetTime();
            previewBox.textContent = `ขณะนี้หมอกำลังจะทำการเข้าพื้นที่สตอรี่ บริเวณ ${loc} ขอให้ผู้ที่อยู่ในพื้นที่ ที่มีสตอรี่ออกจากพื้นที่ก่อนเวลา ${timeStr} น. ขอบคุณค่ะ/ครับ`;
        }

        updatePreview();
        setInterval(updatePreview, 1000);

        window.showToast = function(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2200);
        }

        window.copyText = function() {
            navigator.clipboard.writeText(previewBox.textContent).then(() => {
                showToast("คัดลอกข้อความสำเร็จ!");
                btnCopy.classList.add('success');
                btnCopy.innerHTML = '✅ คัดลอกสำเร็จ!';
                setTimeout(() => {
                    btnCopy.classList.remove('success');
                    btnCopy.innerHTML = '📋 คัดลอกข้อความ';
                }, 1500);
            });
        }
    </script>

</body>
</html>
